services:
  database:
    image: postgres:16
    container_name: pitstop_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pitstop_db}
      POSTGRES_USER: ${POSTGRES_USER:-pitstop_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pitstop_pgdata:/var/lib/postgresql/data
      - ./custom-postgres.conf:/etc/postgresql/postgresql.conf:ro
      - ../database:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    
    # Restrições estritas de hardware para evidenciar contenção de recursos e I/O
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    # Compatibilidade direta com execução Docker sem Swarm
    cpus: 1.0
    mem_limit: 512m
    mem_reservation: 256m

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitstop_admin -d pitstop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pitstop_pgdata:
    name: pitstop_pgdata
