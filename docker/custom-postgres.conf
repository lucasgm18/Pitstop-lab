# =====================================================================
# PITSTOP CORE - POSTGRESQL ENGINE CONFIGURATION
# Optimized for 512MB RAM / 1.0 vCPU Laboratory Environment
# =====================================================================

# ---------------------------------------------------------------------
# 1. CONEXÕES E ORÇAMENTO DE MEMÓRIA (512MB Cgroup Limit)
# ---------------------------------------------------------------------
# Permite conexões em todas as interfaces de rede do container
listen_addresses = '*'

# Limita o número de conexões para evitar esgotamento de memória por
max_connections = 50

# Shared Buffers: 128MB (25% dos 512MB totais).
# Mantém o buffer pool contido para evitar que o Linux OOM Killer encerre
# o processo sob rajadas de escrita ou conexões concorrentes.
shared_buffers = 128MB

# Work Mem: 4MB por operação de ordenação / hash table.
# Configurado propositalmente baixo para que consultas não otimizadas com
# ORDER BY, DISTINCT ou Hash Joins complexos excedam a memória privada e
# façam spill para disco (external merge sort), permitindo diagnósticos via logs.
work_mem = 4MB

# Maintenance Work Mem: 64MB para operações DDL, VACUUM e CREATE INDEX.
maintenance_work_mem = 64MB

# Effective Cache Size: 384MB (~75% da RAM do container).
# Auxilia o otimizador de consultas (planner) a estimar o espaço total de cache
# (PostgreSQL shared buffers + cache de página do kernel Linux).
effective_cache_size = 384MB

# Limite de segurança para arquivos temporários em disco (2GB)
temp_file_limit = 2GB


# ---------------------------------------------------------------------
# 2. EXTENSÕES E SHARED LIBRARIES
# ---------------------------------------------------------------------
# Pré-carrega o módulo de rastreamento de métricas de execução de queries
shared_preload_libraries = 'pg_stat_statements'

# Rastreia todas as instruções (incluindo as executadas dentro de funções/procedimentos)
pg_stat_statements.track = all
pg_stat_statements.max = 10000
pg_stat_statements.track_utility = off


# ---------------------------------------------------------------------
# 3. LOGGING E TROUBLESHOOTING DE INCIDENTES (DBRE SETTINGS)
# ---------------------------------------------------------------------
# Saída para stderr/stdout para ser consumida diretamente pelo docker logs
log_destination = 'stderr'
logging_collector = off

# Prefixo com timestamp ISO, PID do backend, usuário e banco de dados
log_line_prefix = '%m [%p] %q%u@%d '

# Loga qualquer instrução que demore mais de 200ms
log_min_duration_statement = 200

# Registra esperas por lock que excedam o deadlock_timeout
log_lock_waits = on
deadlock_timeout = 1s

# Loga a criação de qualquer arquivo temporário em disco (spill de work_mem)
log_temp_files = 0

# Registra o início e término de todos os checkpoints e estatísticas de escrita
log_checkpoints = on

# Registra toda atividade de autovacuum (tempo de execução, dead tuples e buffers)
log_autovacuum_min_duration = 0

# Rastreia tempos de I/O em pg_stat_database e pg_stat_statements
track_io_timing = on
track_activities = on
track_counts = on


# ---------------------------------------------------------------------
# 4. AUTOVACUUM TUNING (Para evidenciar comportamento no Lab 3)
# ---------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 15s
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
